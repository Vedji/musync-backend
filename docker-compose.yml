services:
  postgres:
    image: postgres:18-alpine
    container_name: musync-backend-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - musync_backend_postgres_data:/var/lib/postgresql

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: musync-backend-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - musync_backend_minio_data:/data

volumes:
  musync_backend_postgres_data:
  musync_backend_minio_data: